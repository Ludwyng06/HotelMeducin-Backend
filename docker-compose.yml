version: '3.8'

services:
  # MongoDB Service
  mongodb:
    build:
      context: ./database/mongodb
      dockerfile: Dockerfile
    container_name: hotel_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./database/mongodb/data:/data/db
      - ./database/mongodb/config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: hotel_meducin_db
    networks:
      - hotel-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Service
  neo4j:
    build:
      context: ./database/neo4j
      dockerfile: Dockerfile
    container_name: hotel_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - ./database/neo4j/data:/data
      - ./database/neo4j/logs:/logs
      - ./database/neo4j/import:/var/lib/neo4j/import
      - ./database/neo4j/plugins:/plugins
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service
  redis:
    build:
      context: ./database/redis
      dockerfile: Dockerfile
    container_name: hotel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./database/redis/data:/data
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/hotel_meducin_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      FRONTEND_URL: http://localhost:4200
      JWT_SECRET: clave_super_segura_para_jwt_hotel_meducin_2024
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - hotel-network

  # Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hotel_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: production
      API_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:4200
    depends_on:
      - backend
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge